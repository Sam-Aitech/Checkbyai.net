version: 2
updates:
  # Python (uv) — backend sidecar
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  # npm — primary surface (Express, Stripe, React, Vite, etc.)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      production-minor:
        dependency-type: "production"
        update-types: ["minor", "patch"]
      dev-minor:
        dependency-type: "development"
        update-types: ["minor", "patch"]

  # GitHub Actions — workflow pins
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  # Docker — Dockerfile base images (node:22-alpine)
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
