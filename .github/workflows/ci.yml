name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: TypeScript type check
        run: npm run check

  dependency-audit:
    name: Dependency Audit (audit-ci)
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run audit-ci
        id: audit
        shell: bash
        run: |
          set +e
          npm run audit -- --report-type full 2>&1 | tee audit-output.txt
          EXIT_CODE=${PIPESTATUS[0]}
          echo "exit_code=$EXIT_CODE" >> "$GITHUB_OUTPUT"
          grep -Eo 'CVE-[0-9]{4}-[0-9]+|GHSA-[a-z0-9]{4}-[a-z0-9]{4}-[a-z0-9]{4}' audit-output.txt | sort -u > failing-cves.txt || true
          exit 0

      - name: Comment failing CVEs on PR
        if: ${{ github.event_name == 'pull_request' && steps.audit.outputs.exit_code != '0' }}
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const cveFile = 'failing-cves.txt';
            const cves = fs.existsSync(cveFile)
              ? fs.readFileSync(cveFile, 'utf8').split('\n').map(s => s.trim()).filter(Boolean)
              : [];
            const lines = cves.length > 0
              ? cves.map(cve => `- ${cve}`)
              : ['- Unable to parse CVE/GHSA IDs from audit output. Check CI logs for details.'];
            const body = [
              '## 🚫 Dependency audit failed',
              '',
              'audit-ci detected high/critical vulnerabilities.',
              '',
              '### Failing CVEs / advisories',
              ...lines
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });

      - name: Fail job on high/critical vulnerabilities
        if: ${{ steps.audit.outputs.exit_code != '0' }}
        run: |
          echo "audit-ci failed: high/critical vulnerabilities detected."
          exit 1

  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, dependency-audit]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test:run

      - name: Install Playwright Chromium
        if: ${{ github.event_name == 'pull_request' && github.base_ref == 'main' }}
        run: npm run playwright:install

      - name: Run Playwright E2E tests
        if: ${{ github.event_name == 'pull_request' && github.base_ref == 'main' }}
        env:
          TEST_BASE_URL: ${{ vars.TEST_BASE_URL || secrets.TEST_BASE_URL }}
        run: |
          if [ -z "$TEST_BASE_URL" ]; then
            echo "TEST_BASE_URL (repo variable or secret) is required for Playwright E2E in CI."
            exit 1
          fi
          npm run test:e2e

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, dependency-audit, test]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7
