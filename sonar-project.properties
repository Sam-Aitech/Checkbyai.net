sonar.organization=sam-aitech
sonar.projectKey=Sam-Aitech_Checkbyai.net
sonar.projectName=Checkbyai.net
sonar.sourceEncoding=UTF-8

sonar.sources=server,client/src,backend,sponsor-etl-agent
sonar.exclusions=**/node_modules/**,dist/**,migrations/**,**/__tests__/**,**/*.test.ts

sonar.typescript.tsconfigPaths=tsconfig.json
sonar.javascript.file.suffixes=.js,.jsx,.ts,.tsx
sonar.python.version=3.11
sonar.python.file.suffixes=.py

sonar.javascript.lcov.reportPaths=./coverage/lcov.info

# Gate evaluation runs in CI, while the actual gate conditions are managed in SonarQube Cloud.
# Configure the project's Quality Gate in sonarcloud.io to fail on:
# - any new blocker or critical issue
# - any new high-severity security issue
# - security hotspot review coverage below 100% on new code
# - new code coverage below 80%
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300
