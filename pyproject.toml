[project]
name = "repl-nix-workspace"
version = "0.1.0"
description = "Checkbyai Python sidecar: FastAPI app (backend/main.py) — CoS verify, sponsor ETL, enrichment, job scraper"
requires-python = ">=3.11"
# Keep in sync with backend/requirements.txt (human-readable reference) and
# with the actual import graph under backend/ — deps with no importer are
# removed here rather than carried as dead weight (onnxruntime, scikit-learn,
# numpy, protobuf, duckdb, camoufox were removed 2026-09-26).
dependencies = [
    "fastapi>=0.141.1",
    "starlette>=1.6.0",
    "uvicorn>=0.52.1",
    "python-multipart>=0.0.32",
    "pydantic>=2.13.5",
    "requests>=2.34.2",
    "lxml>=6.1.1",
    "scrapling>=0.4.14",
    "curl-cffi>=0.16.0",
    "crawl4ai>=0.9.2",
    "pymupdf>=1.28.2",
    "rapidfuzz>=3.6.0",
    "httpx>=0.27.0",
    "psycopg2-binary>=2.9.13",
]

[tool.pytest.ini_options]
# backend/ is a package (has __init__.py) but its modules use flat imports
# (main.py does `from cos_verifier import ...`), so put backend/ itself on
# sys.path — this is also how the sidecar is launched (cwd = backend/).
testpaths = ["backend"]
pythonpath = ["backend"]

[tool.uv]
override-dependencies = [
    "aiohttp>=3.14.3",
    "anyio>=4.14.2",
    "click>=8.3.3",
    "h2>=4.4.1",
    "idna>=3.15",
    "lxml>=6.1.1",
    "nltk>=3.10.3",
    "pillow>=12.3.0",
    "cryptography>=50.0.0",
    "urllib3>=2.7.0",
    "soupsieve>=2.9.1",
]

[[tool.uv.index]]
explicit = true
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"

[tool.uv.sources]
# Only packages actually in uv.lock need a source redirect. Do NOT
# re-add the Replit-generated dump of ~1100 unrelated packages that used
# to live here (pruned 2026-09-26; removal is lock-neutral, verified by
# re-running `uv lock` with zero diff).
huggingface-hub = [{ index = "pytorch-cpu", marker = "platform_system == 'Linux'" }]
