# Configuration for SonarCloud AUTOMATIC ANALYSIS.
#
# Automatic Analysis does not read sonar-project.properties — that file is only
# used by the CI scanner, which currently aborts with
#   "You are running CI analysis while Automatic Analysis is enabled" (exit 3)
# and is masked by continue-on-error in .github/workflows/sonarcloud.yml.
# The two files are kept in sync deliberately; change both together.
#
# Sonar's docs say this file applies from the default branch; in practice
# Automatic Analysis picked it up from the pull request branch immediately
# (verified on PR #99, which went from 8 open issues to 0).

# Wildcards are not permitted in sonar.sources — comma-separated directories only.
sonar.sources=server,client/src,backend

# migrations/** holds drizzle-kit generated PostgreSQL DDL. Sonar has no
# PostgreSQL profile and falls back to its Oracle PL/SQL rules, which produce
# categorically wrong findings on it — e.g. plsql:VarcharUsageCheck demanding
# VARCHAR2 (an Oracle-only type that does not exist in PostgreSQL) and
# plsql:SizeConstraintMissingCheck raising BLOCKER bugs on unbounded VARCHAR,
# which is valid and idiomatic in PostgreSQL. Those BLOCKERs alone dropped the
# reliability rating to E and failed the quality gate on PR #99. The files are
# generated and must match shared/schema.ts, so they cannot be edited to suit
# a different dialect's rules.
sonar.exclusions=**/node_modules/**,dist/**,migrations/**,**/__tests__/**,**/*.test.ts
