<svg width="1200" height="630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563eb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7c3aed;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e0e7ff;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGradient)"/>
  
  <!-- Decorative Elements -->
  <circle cx="100" cy="100" r="80" fill="rgba(255,255,255,0.1)"/>
  <circle cx="1100" cy="530" r="60" fill="rgba(255,255,255,0.1)"/>
  <rect x="900" y="50" width="200" height="2" fill="rgba(255,255,255,0.3)"/>
  <rect x="50" y="500" width="300" height="2" fill="rgba(255,255,255,0.3)"/>
  
  <!-- Main Content -->
  <text x="600" y="200" font-family="Arial, sans-serif" font-size="72" font-weight="bold" text-anchor="middle" fill="url(#textGradient)">
    COS Check by AI
  </text>
  
  <text x="600" y="280" font-family="Arial, sans-serif" font-size="36" text-anchor="middle" fill="rgba(255,255,255,0.9)">
    Certificate of Sponsorship Verification
  </text>
  
  <text x="600" y="350" font-family="Arial, sans-serif" font-size="28" text-anchor="middle" fill="rgba(255,255,255,0.8)">
    Check by AI Technology • 99.9% Accuracy • Instant Results
  </text>
  
  <!-- AI Icon -->
  <g transform="translate(520,400)">
    <circle cx="80" cy="40" r="35" fill="rgba(255,255,255,0.2)" stroke="white" stroke-width="2"/>
    <circle cx="70" cy="35" r="3" fill="white"/>
    <circle cx="90" cy="35" r="3" fill="white"/>
    <path d="M70,45 Q80,55 90,45" stroke="white" stroke-width="2" fill="none"/>
  </g>
  
  <!-- Footer -->
  <text x="600" y="580" font-family="Arial, sans-serif" font-size="24" text-anchor="middle" fill="rgba(255,255,255,0.7)">
    document-authenticator.replit.app
